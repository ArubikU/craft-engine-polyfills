# Per-block RESTITUTION (bounciness) for vanilla blocks - how much of a head-on impact a surface hands back
# as a bounce.
#
# It is a coefficient of restitution: the fraction of closing speed returned as separation at a contact.
# Higher = bouncier.
#
#     0.0   every ordinary block - absorbs the hit (the default)
#     1.0   slime block - the ONE vanilla bouncy block
#
# Restitution is CELL-LOCAL, unlike mass / friction / floatability (which are one mass-weighted-mean number
# for the whole body). A contraption only bounces where the CONTACTED cell is bouncy: a slime cell in a
# structure's floor bounces when THAT cell lands, while a stone cell beside it does not. Between two bodies
# the bouncier contacted cell wins. Below a small closing speed the bounce is suppressed so a resting body
# settles instead of jittering (see XpbdSolver RESTITUTION_MIN_SPEED).
#
# Lookup order, first match wins:
#   1. a CraftEngine custom block's own `polyfills:restitution_block` behavior
#   2. the `blocks:` map below
#   3. the built-in table (only the slime block, at 1.0)
#   4. `default:` below
#
# Keys are Bukkit material names; a `minecraft:` prefix is accepted.

default: 0.0

blocks:
#  SLIME_BLOCK: 1.0
#  HONEY_BLOCK: 0.0
