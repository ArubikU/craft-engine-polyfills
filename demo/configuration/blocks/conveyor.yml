# Logical recipe (Create-style): 3 dried_kelp (belt) + 2 iron + 1 copper -> 4 conveyors.
recipes:
  demo:conveyor:
    type: shaped
    pattern:
      - "KKK"
      - "ICI"
    ingredients:
      K: minecraft:dried_kelp
      I: minecraft:iron_ingot
      C: minecraft:copper_ingot
    result:
      id: demo:conveyor
      count: 4
