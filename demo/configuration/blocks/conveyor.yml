blocks:
  demo:conveyor:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 0.8
      resistance: 0.8
      push_reaction: destroy
      replaceable: false
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.stone.break
        place: minecraft:block.stone.place
        step: minecraft:block.wood.step
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    behavior:
      type: polyfills:conveyor
      facing: north
      # Tunables: ticks for one item to cross a segment at base speed (lower = faster),
      # and the reference rpm. Both scale item transfer speed + the visual belt pace.
      base-travel-ticks: 16
      base-rpm: 64
      # Stress (SU) each segment imposes on the driving motor, scaled by speed:
      # actual = stress-impact × (motorRpm / base-rpm). So 2× rpm = 2× speed AND 2× SU
      # per segment. The line stalls if its total exceeds the motor's stress-capacity.
      stress-impact: 4
      # How many items a single segment carries at once (each at its own position,
      # spacing = 1/slots). They queue up and can't overtake each other.
      slots: 4
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        slope:
          type: string
          values: [flat, up, down]
          default: flat
        part:
          type: string
          values: [start, middle, end]
          default: end
        activated:
          type: boolean
          default: false
      appearances:
        flat_start_north_on:
          state: waxed_copper_trapdoor[facing=north,half=bottom,open=false,powered=true,waterlogged=false]
          entity_renderer: { item: demo:cv_conveyor_flat_end, rotation: 180 }
        flat_start_north_off:
          state: waxed_copper_trapdoor[facing=north,half=bottom,open=false,powered=true,waterlogged=false]
          entity_renderer: { item: demo:cv_conveyor_flat_end_off, rotation: 180 }
        flat_start_east_on:
          state: waxed_copper_trapdoor[facing=north,half=bottom,open=false,powered=true,waterlogged=false]
          entity_renderer: { item: demo:cv_conveyor_flat_end, rotation: 270 }
        flat_start_east_off:
