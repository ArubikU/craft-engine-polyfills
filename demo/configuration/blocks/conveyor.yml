          entity_renderer: { item: demo:cv_conveyor_flat_end_off, rotation: 270 }
        flat_start_south_on:
          state: waxed_copper_trapdoor[facing=north,half=bottom,open=false,powered=true,waterlogged=false]
          entity_renderer: { item: demo:cv_conveyor_flat_end, rotation: 0 }
        flat_start_south_off:
