# CraftEngine conveyor belt (FULL state matrix).
# Behavior -> dev.arubik.craftengine.conveyor.ConveyorBehavior (polyfills:conveyor)
# Properties read live by the polyfill:
#   facing    : 4-direction  (travel toward next/END)
#   slope     : string flat/up/down (45deg ramps, corner-to-corner)
#   part      : string start/middle/end
#   activated : boolean  (set by the polyfill: true when the belt has RPM/running)
# 'activated' swaps the model: ON = animated belt_top, OFF = static grey belt_top_static.
# 9 geometries x 4 facing x 2 activated = 72 states (x on/off models).

items:
  demo:conveyor:
    data:
      item_name: "<!i><white>Conveyor Belt"
    model: minecraft:block/custom/conveyor/conveyor_flat_middle
    behavior:
      type: block_item
      block: demo:conveyor

blocks:
  demo:conveyor:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 0.8
      resistance: 0.8
      push_reaction: destroy
      replaceable: false
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.stone.break
        place: minecraft:block.stone.place
        step: minecraft:block.wood.step
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    behavior:
      type: polyfills:conveyor
      facing: north
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        slope:
          type: string
          values: [flat, up, down]
          default: flat
        part:
          type: string
          values: [start, middle, end]
          default: end
        activated:
          type: boolean
          default: false
      appearances:
        flat_start_north_on:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start }
        flat_start_north_off:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start_off }
        flat_start_east_on:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start, y: 90 }
