# CraftEngine block definition for the polyfill conveyor belt (FULL state matrix).
# Behavior key -> dev.arubik.craftengine.conveyor.ConveyorBehavior (polyfills:conveyor)
#
# State properties read live by the polyfill:
#   facing : 4-direction          (travel toward next/END segment)
#   slope  : string flat/up/down  (45-degree ramps)
#   part   : string start/middle/end
# Models live in demo/resourcepack/assets/minecraft/models/block/custom/conveyor/.
# 9 base geometries (slope x part) x 4 facing rotations (y 0/90/180/270) = 36 states.
# Supply textures: belt_top, belt_bottom, belt_side, roller (PNG, same folder under textures/).

items:
  demo:conveyor:
    data:
      item_name: "<!i><white>Conveyor Belt"
    model: minecraft:block/custom/conveyor/conveyor_flat_middle
    behavior:
      type: block_item
      block: demo:conveyor

blocks:
  demo:conveyor:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 0.8
      resistance: 0.8
      push_reaction: destroy
      replaceable: false
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.stone.break
        place: minecraft:block.stone.place
        step: minecraft:block.wood.step
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    behavior:
      type: polyfills:conveyor
      facing: north
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        slope:
          type: string
          values: [flat, up, down]
          default: flat
        part:
          type: string
          values: [start, middle, end]
          default: end
      appearances:
        flat_start_north:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start }
        flat_start_east:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start, y: 90 }
        flat_start_south:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start, y: 180 }
        flat_start_west:
          auto_state: solid
          model: { path: minecraft:block/custom/conveyor/conveyor_flat_start, y: 270 }
        flat_middle_north:
