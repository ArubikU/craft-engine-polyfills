# Advanced Vapor Motor — dev.arubik.craftengine.rotation.AdvancedVaporMotorBehavior
# (polyfills:advanced_vapor_motor). Upgradeable, multi-gas. Separate block from the
# basic motor so both can be tested. Reuses the motor's models/textures.

items:
  demo:advanced_vapor_motor:
    data:
      item_name: "<!i><gradient:#7fe0ee:#2a8fa6><b>Vapor Motor MkII</b></gradient>"
    model: minecraft:block/custom/vapor_motor/vapor_motor
    behavior:
      type: block_item
      block: demo:advanced_vapor_motor

blocks:
  demo:advanced_vapor_motor:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 1.5
      resistance: 1.5
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.copper.break
        place: minecraft:block.copper.place
        step: minecraft:block.copper.step
        hit: minecraft:block.copper.hit
        fall: minecraft:block.copper.fall
    behavior:
      type: polyfills:advanced_vapor_motor
      vapor-capacity: 10000
      # Per-gas output + cost. rpm/su <= 0 (or absent) = that gas is unsupported.
      gases:
        steam:       { rpm: 32, su: 64, gas-per-tick: 20 }
        heavy_steam: { rpm: 48, su: 96, gas-per-tick: 30 }
      # Upgrade modules (item -> modifier). extra_slots is the standard slot-unlocker.
      upgrades:
        minecraft:redstone:       { type: overclock_limit, value: 0.5 }   # +50% overclock cap
        minecraft:sugar:          { type: consume,         value: 0.10 }  # -10% gas use
        minecraft:glowstone_dust: { type: generation,      value: 0.10 }  # +10% output
        demo:iron_gear:           { type: extra_slots,     value: 2 }     # unlock +1 upgrade slot
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        activated:
          type: boolean
          default: false
      appearances:
        on_north:  { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor } }
        on_east:   { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor, y: 90 } }
        on_south:  { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor, y: 180 } }
        on_west:   { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor, y: 270 } }
        off_north: { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off } }
        off_east:  { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off, y: 90 } }
        off_south: { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off, y: 180 } }
        off_west:  { auto_state: cactus, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off, y: 270 } }
      variants:
        "facing=north,activated=true":  { appearance: on_north }
        "facing=east,activated=true":   { appearance: on_east }
        "facing=south,activated=true":  { appearance: on_south }
        "facing=west,activated=true":   { appearance: on_west }
        "facing=north,activated=false": { appearance: off_north }
        "facing=east,activated=false":  { appearance: off_east }
        "facing=south,activated=false": { appearance: off_south }
        "facing=west,activated=false":  { appearance: off_west }

recipes:
  demo:advanced_vapor_motor:
    type: shaped
    pattern: [ "GIG", "IMI", "GIG" ]
    ingredients:
      G: demo:iron_gear
      I: minecraft:iron_ingot
      M: demo:vapor_motor
    result: { id: demo:advanced_vapor_motor, count: 1 }
