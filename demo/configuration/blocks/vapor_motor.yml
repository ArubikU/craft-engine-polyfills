# Vapor motor — dev.arubik.craftengine.rotation.VaporMotorBehavior (polyfills:vapor_motor)
# Consumes "vapor" (gas GasType.STEAM) and produces RPM, pushed ONLY to the block in
# its facing direction (the belt head). Vapor is inserted ONLY from the TOP face.
#
# Two visual states: activated=true (running, animated motor.png) / false (idle, motor_off.png).
# Hosted on `auto_state: solid` (full hitbox); cactus group is reserved for the MkII.

items:
  demo:vapor_motor:
    data:
      item_name: "<!i><aqua>Vapor Motor"
    model: minecraft:block/custom/vapor_motor/vapor_motor
    behavior:
      type: block_item
      block: demo:vapor_motor

blocks:
  demo:vapor_motor:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 1.5
      resistance: 1.5
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.copper.break
        place: minecraft:block.copper.place
        step: minecraft:block.copper.step
        hit: minecraft:block.copper.hit
        fall: minecraft:block.copper.fall
    behavior:
      type: polyfills:vapor_motor
      vapor-capacity: 10000
      vapor-per-tick: 20
      max-rpm: 128
      stress-capacity: 256
      vapor-per-stress: 1
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        activated:
          type: boolean
          default: false
      appearances:
        on_north:  { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor } }
        on_east:   { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor, y: 90 } }
        on_south:  { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor, y: 180 } }
        on_west:   { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor, y: 270 } }
        off_north: { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off } }
        off_east:  { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off, y: 90 } }
        off_south: { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off, y: 180 } }
        off_west:  { auto_state: solid, model: { path: minecraft:block/custom/vapor_motor/vapor_motor_off, y: 270 } }
      variants:
        "facing=north,activated=true":  { appearance: on_north }
        "facing=east,activated=true":   { appearance: on_east }
        "facing=south,activated=true":  { appearance: on_south }
        "facing=west,activated=true":   { appearance: on_west }
        "facing=north,activated=false": { appearance: off_north }
        "facing=east,activated=false":  { appearance: off_east }
        "facing=south,activated=false": { appearance: off_south }
        "facing=west,activated=false":  { appearance: off_west }
