# Conveyor SPLITTER — dev.arubik.craftengine.conveyor.SplitterBehavior (polyfills:conveyor_splitter)
# Directional. 1 input (back), 3 outputs (front / right / left). Items are distributed as
# evenly as possible across the three outputs regardless of each output's drain rate, the
# items' stack size, or belt RPM: each item goes to the output (with room) that has
# received the fewest so far. Blocked outputs are skipped and re-balanced when they free.
#
# Factory args (optional):
#   facing : fallback 4-direction (the centre output side; states drive it)
#   slots  : internal buffer size (default 6)

items:
  demo:conveyor_splitter:
    data:
      item_name: "<!i><lang:item.demo.conveyor_splitter>"
    model: minecraft:block/custom/conveyor_io/splitter
    behavior:
      type: block_item
      block: demo:conveyor_splitter

blocks:
  demo:conveyor_splitter:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 0.8
      resistance: 0.8
      push_reaction: destroy
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.stone.break
        place: minecraft:block.stone.place
        step: minecraft:block.wood.step
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    behavior:
      type: polyfills:conveyor_splitter
      facing: north
      slots: 6
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        north: { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/splitter } }
        east:  { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/splitter, y: 90 } }
        south: { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/splitter, y: 180 } }
        west:  { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/splitter, y: 270 } }
      variants:
        "facing=north": { appearance: north }
        "facing=east": { appearance: east }
        "facing=south": { appearance: south }
        "facing=west": { appearance: west }

recipes:
  demo:conveyor_splitter:
    type: shaped
    pattern:
      - "CKC"
      - " C "
    ingredients:
      K: minecraft:dried_kelp
      C: minecraft:copper_ingot
    result:
      id: demo:conveyor_splitter
      count: 1
