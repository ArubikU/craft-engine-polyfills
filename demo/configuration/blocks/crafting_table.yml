# JIT crafting table — dev.arubik.craftengine.crafting.CraftingTableBehavior (polyfills:crafting_table)
# Right-click opens an N x M crafting GUI backed by the crafting framework.
# Recipes are registered in code (CraftingSamples / CraftingRecipeRegistry); the
# block only declares the grid size + title.
#
# Factory args: grid-width (default 3), grid-height (default 3), title.
# For a 5x5 table set grid-width: 5 / grid-height: 5 and register 5x5 recipes.

items:
  demo:crafting_table:
    data:
      item_name: "<!i><gold>JIT Crafting Table"
    model: minecraft:block/crafting_table
    behavior:
      type: block_item
      block: demo:crafting_table

blocks:
  demo:crafting_table:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 2.0
      resistance: 2.0
      tags: ["minecraft:mineable/axe"]
      sounds:
        break: minecraft:block.wood.break
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
        hit: minecraft:block.wood.hit
        fall: minecraft:block.wood.fall
    behavior:
      type: polyfills:crafting_table
      grid-width: 3
      grid-height: 3
      title: "Crafting"
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        base: { auto_state: solid, model: { path: minecraft:block/crafting_table } }
      variants:
        "facing=north": { appearance: base }
        "facing=east": { appearance: base }
        "facing=south": { appearance: base }
        "facing=west": { appearance: base }
