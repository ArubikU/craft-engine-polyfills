# Engineer's workbench (Immersive-Engineering-style crafting station).
# Behavior -> dev.arubik.craftengine.crafting.WorkbenchBehavior (polyfills:workbench)
# UI: 6x9 chest base; usable 6-wide x 4-tall region -> 3x2 input grid + 2 outputs
# + 1 tool slot; everything else is BACKGROUND (not placeable). Overlay your own
# GUI texture aligned to the slot indices the behavior reports.
#
# This is now a REAL 2-collision double block (dev.arubik...multiblock.
# HorizontalDoubleBlockBehavior, subclassed by WorkbenchBehavior). The placed
# block is the LEFT (master) half; a RIGHT half is auto-placed one cell toward
# facing.clockWise(). Breaking either removes both; right-clicking either opens
# the master's menu. The model is SPLIT: workbench_left renders x 0..16, and
# workbench_right renders the old x 16..32 shifted to 0..16. The item keeps the
# original 2-wide workbench.json as its inventory model.

items:
  demo:workbench:
    data:
      item_name: "<!i><gold>Engineer's Workbench"
    model: minecraft:block/custom/workbench/workbench
    behavior:
      type: block_item
      block: demo:workbench

blocks:
  demo:workbench:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 2.5
      resistance: 2.5
      tags: ["minecraft:mineable/axe", "minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.wood.break
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
        hit: minecraft:block.wood.hit
        fall: minecraft:block.wood.fall
    behavior:
      type: polyfills:workbench
      title: "Engineer's Workbench"
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        # LEFT = master/origin half; RIGHT = the auto-placed second half.
        half:
          type: string
          values: [left, right]
          default: left
      appearances:
        left_north:  { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_left } }
        left_east:   { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_left, y: 90 } }
        left_south:  { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_left, y: 180 } }
        left_west:   { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_left, y: 270 } }
        right_north: { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_right } }
        right_east:  { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_right, y: 90 } }
        right_south: { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_right, y: 180 } }
        right_west:  { auto_state: solid, model: { path: minecraft:block/custom/workbench/workbench_right, y: 270 } }
      variants:
        "half=left:facing=north":  { appearance: left_north }
        "half=left:facing=east":   { appearance: left_east }
        "half=left:facing=south":  { appearance: left_south }
        "half=left:facing=west":   { appearance: left_west }
        "half=right:facing=north": { appearance: right_north }
        "half=right:facing=east":  { appearance: right_east }
        "half=right:facing=south": { appearance: right_south }
        "half=right:facing=west":  { appearance: right_west }

# --- Example custom GUI texture ---
# An example chest-GUI background is provided at
#   resourcepack/assets/minecraft/textures/gui/workbench.png  (176x132, slots marked)
# rendered via the font provider  assets/minecraft/font/workbench.json  (PUA char U+E000).
# To show it, set this block's `title` to the glyph so Minecraft draws the image in the
# menu title area (standard "image-in-title" technique):
#   title: ""        # optionally prefix negative-space chars to center it
# Tune `ascent` in the font json to slide the image over the chest slots. The slot
# highlights in the PNG match the behavior's indices (input 10/11/12,19/20/21;
# outputs 14,23; tool 16).
