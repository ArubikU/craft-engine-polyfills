# Conveyor MERGER — dev.arubik.craftengine.conveyor.MergerBehavior (polyfills:conveyor_merger)
# Directional. 3 inputs (back / left / right), 1 output (front = facing). Belts feeding
# from any side except the front are merged into a small buffer and fed onto a single
# downstream belt/receiver in front (first-in-first-out, with backpressure).
#
# Factory args (optional):
#   facing : fallback 4-direction when the state has no facing (states drive it)
#   slots  : internal buffer size (default 6)

items:
  demo:conveyor_merger:
    data:
      item_name: "<!i><lang:item.demo.conveyor_merger>"
    model: minecraft:block/custom/conveyor_io/merger
    behavior:
      type: block_item
      block: demo:conveyor_merger

blocks:
  demo:conveyor_merger:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 0.8
      resistance: 0.8
      push_reaction: destroy
      tags: ["minecraft:mineable/pickaxe"]
      sounds:
        break: minecraft:block.stone.break
        place: minecraft:block.stone.place
        step: minecraft:block.wood.step
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
    behavior:
      type: polyfills:conveyor_merger
      facing: north
      slots: 6
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        north: { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/merger } }
        east:  { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/merger, y: 90 } }
        south: { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/merger, y: 180 } }
        west:  { auto_state: solid, model: { path: minecraft:block/custom/conveyor_io/merger, y: 270 } }
      variants:
        "facing=north": { appearance: north }
        "facing=east": { appearance: east }
        "facing=south": { appearance: south }
        "facing=west": { appearance: west }

recipes:
  demo:conveyor_merger:
    type: shaped
    pattern:
      - "C C"
      - "CKC"
    ingredients:
      K: minecraft:dried_kelp
      C: minecraft:copper_ingot
    result:
      id: demo:conveyor_merger
      count: 1
