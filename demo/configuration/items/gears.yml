# Three gear tiers — shared steam-tech crafting components (consumable in recipes).
items:
  demo:stone_gear:
    data:
      item_name: "<!i><gray><lang:item.demo.stone_gear>"
      lore: [ "<!i><dark_gray><lang:demo.item.component>" ]
    model: minecraft:item/custom/stone_gear
  demo:copper_gear:
    data:
      item_name: "<!i><color:#d98a4a><lang:item.demo.copper_gear>"
      lore: [ "<!i><dark_gray><lang:demo.item.component>" ]
    model: minecraft:item/custom/copper_gear
  demo:iron_gear:
    data:
      item_name: "<!i><white><lang:item.demo.iron_gear>"
      lore: [ "<!i><dark_gray><lang:demo.item.component>" ]
    model: minecraft:item/custom/iron_gear

recipes:
  demo:stone_gear:
    type: shaped
    pattern: [ " S ", "SNS", " S " ]
    ingredients: { S: minecraft:stone, N: minecraft:iron_nugget }
    result: { id: demo:stone_gear, count: 1 }
  demo:copper_gear:
    type: shaped
    pattern: [ " C ", "CNC", " C " ]
    ingredients: { C: minecraft:copper_ingot, N: minecraft:iron_nugget }
    result: { id: demo:copper_gear, count: 1 }
  demo:iron_gear:
    type: shaped
    pattern: [ " I ", "INI", " I " ]
    ingredients: { I: minecraft:iron_ingot, N: minecraft:iron_nugget }
    result: { id: demo:iron_gear, count: 1 }
